name: elm / pr

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        node-version: [12.x, 14.x, 16.x]

    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install elm + tools and cache the ELM_HOME directory
        uses: mpizenberg/elm-tooling-action@cbc43aedc689be4271ecec1bdd18755a6ed7f8f3
        with:
          cache-key: elm-${{ matrix.node-version }}-${{ hashFiles('elm-tooling.json', 'template/elm.json') }}
          cache-restore-key: elm-${{ matrix.node-version }}

      - name: Check that everything is alright
        run: bin/build.sh

  elm-test-runner:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout exercism/elm
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run tests for all exercises
        run: bin/run-all-exercises-in-docker.sh

  elm-analyzer:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout exercism/elm
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run tests for all exercises
        run: bin/analyze-all-exercises-in-docker.sh

  tests:
    name: Tests
    needs: ci
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check that every Node.js version passed
        env:
          RESULT: ${{ needs.ci.result }}
        run: |
          if [[ "$RESULT" != "success" ]]; then
            echo "The exercise tests failed on at least one Node.js version."
            exit 1
          fi
